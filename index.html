<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FollowBoost</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #075e54;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .logo {
      font-size: 32px;
      font-weight: bold;
      margin-top: 30px;
    }

    .tagline {
      margin-top: 8px;
      opacity: 0.85;
    }

    .card {
      background: white;
      color: #111;
      border-radius: 20px;
      padding: 25px;
      margin-top: 30px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
    }

    p {
      line-height: 1.6;
      color: #555;
    }

    button {
      width: 100%;
      border: 0;
      padding: 16px;
      margin-top: 12px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .green {
      background: #25d366;
      color: white;
    }

    .dark {
      background: #075e54;
      color: white;
    }

    .status {
      margin-top: 20px;
      padding: 15px;
      background: #f1f1f1;
      border-radius: 10px;
      color: #075e54;
      display: none;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="logo">
      FollowBoost 🚀
    </div>

    <div class="tagline">
      Discover WhatsApp Channels. Grow your audience.
    </div>

    <div class="card">

      <h1>Grow your channel</h1>

      <p>
        Share your WhatsApp Channel with people who are
        interested in your content.
      </p>

      <button class="green" onclick="addChannel()">
        ＋ Add My Channel
      </button>

      <button class="dark" onclick="discover()">
        🔎 Discover Channels
      </button>

      <div id="status" class="status"></div>

    </div>

  </div>

  <script>
    function addChannel() {
      document.getElementById("status").style.display = "block";
      document.getElementById("status").textContent =
        "Channel setup coming next 🚀";
    }

    function discover() {
      document.getElementById("status").style.display = "block";
      document.getElementById("status").textContent =
        "Channel discovery coming next 🔥";
    }
  </script>

</body>
</html>
