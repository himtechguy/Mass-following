<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FollowBoost — Add Channel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#075e54;
  font-family:Arial,sans-serif;
}

.app{
  max-width:600px;
  margin:auto;
  padding:20px;
}

header{
  color:white;
  font-size:27px;
  font-weight:bold;
  padding:20px 0;
}

.card{
  background:white;
  border-radius:20px;
  padding:25px;
}

h1{
  margin-top:0;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:10px;
  background:#25d366;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.back{
  display:block;
  margin-top:18px;
  text-align:center;
  color:#075e54;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="app">

<header>
  FollowBoost 🚀
</header>

<div class="card">

<h1>Add Your Channel</h1>

<p>
Add your WhatsApp Channel so people can discover it.
</p>

<label>Channel Name</label>

<input
  id="name"
  type="text"
  placeholder="e.g. Takue Wacho">

<label>WhatsApp Channel Link</label>

<input
  id="link"
  type="url"
  placeholder="https://whatsapp.com/channel/...">

<button onclick="saveChannel()">
  Add Channel
</button>

<a class="back" href="index.html">
  ← Back Home
</a>

</div>

</div>

<script>

function saveChannel(){

  const name =
    document.getElementById("name").value.trim();

  const link =
    document.getElementById("link").value.trim();

  if(!name || !link){

    alert("Please enter both fields.");

    return;
  }

  if(!link.includes("whatsapp.com/channel/")){

    alert("Please enter a valid WhatsApp Channel link.");

    return;
  }

  const channel = {
    name:name,
    link:link
  };

  localStorage.setItem(
    "myChannel",
    JSON.stringify(channel)
  );

  alert("Channel saved successfully! 🚀");

  window.location.href =
    "discover.html";
}

</script>

</body>
</html>
