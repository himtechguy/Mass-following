<script>

const SUPABASE_URL = "https://zascjrrvukrdgydqwyqa.supabase.co";
const SUPABASE_KEY = "sb_publishable_tXet8cUNY_eEEVUQ-eHW5A_ziO_w4Xw";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let channels = [];
let selectedCategory = "All";


async function loadChannels() {

  const container = document.getElementById("channels");

  container.innerHTML = `
    <div class="empty">
      Loading channels... ⏳
    </div>
  `;

  const { data, error } = await supabase
    .from("channels")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        ❌ Could not load channels.
        <br><br>
        Please try again.
      </div>
    `;

    return;
  }

  channels = data || [];

  filterChannels();
}


function displayChannels(list) {

  const container =
    document.getElementById("channels");

  container.innerHTML = "";


  if (list.length === 0) {

    container.innerHTML = `
      <div class="empty">
        😕 No channels found.
        <br><br>
        Add the first channel!
      </div>
    `;

    return;
  }


  list.forEach(channel => {

    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div class="channel-name">
        ${escapeHTML(channel.name)}
      </div>

      <div class="category-name">
        ${escapeHTML(channel.category || "General")}
      </div>

      <div class="description">
        ${escapeHTML(channel.description || "WhatsApp Channel")}
      </div>

      <a
        class="follow"
        href="${escapeHTML(channel.link)}"
        target="_blank"
        rel="noopener"
      >
        Follow Channel 🚀
      </a>

    `;


    container.appendChild(card);

  });

}


function filterChannels() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    channels.filter(channel => {

      const name =
        (channel.name || "").toLowerCase();

      const description =
        (channel.description || "").toLowerCase();


      const matchesSearch =
        name.includes(search) ||
        description.includes(search);


      const matchesCategory =
        selectedCategory === "All" ||
        channel.category === selectedCategory;


      return matchesSearch && matchesCategory;

    });


  displayChannels(filtered);

}


function selectCategory(category, button) {

  selectedCategory = category;


  document
    .querySelectorAll(".category")
    .forEach(btn => {
      btn.classList.remove("active");
    });


  button.classList.add("active");


  filterChannels();

}


function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


loadChannels();

</script>
